<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c26"/>
      <stop offset="50%" stop-color="#0f1218"/>
      <stop offset="100%" stop-color="#080a0e"/>
    </linearGradient>

    <!-- Outer Glow / Ambient Lighting -->
    <radialGradient id="ambientGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Tile 1: Search - Cyan Gradient -->
    <linearGradient id="cyanTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Tile 2: AI Sparkle - Frosted Glass Gradient -->
    <linearGradient id="aiGlassTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Tile 3: Trading Chart - Emerald / Cyan Neon Gradient -->
    <linearGradient id="chartGlassTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Tile 4: Notes & Tasks - Vibrant Violet Gradient -->
    <linearGradient id="violetTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Glass Specular Highlight -->
    <linearGradient id="specularGlint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App Icon Base Squircle (iOS / Android Adaptive Safe) -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#ambientGlow)"/>
  
  <!-- Outer Specular Ring -->
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- Top Specular Sheen -->
  <path d="M 0,115 Q 0,0 115,0 L 397,0 Q 512,0 512,115 C 400,160 112,160 0,115 Z" fill="url(#specularGlint)" opacity="0.16"/>

  <!-- Grid Graphic Container (2x2 Modular Workspace Tiles) -->
  <g filter="url(#shadowFilter)">
    
    <!-- ==================== TILE 1: TOP-LEFT (Search / Spotlight) ==================== -->
    <g filter="url(#tileShadow)">
      <rect x="114" y="114" width="132" height="132" rx="34" fill="url(#cyanTile)"/>
      <rect x="115" y="115" width="130" height="130" rx="33" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/>
      <!-- Top Bevel Glint -->
      <path d="M 122,138 C 122,126 134,120 148,120 L 212,120 C 226,120 238,126 238,138 C 190,148 150,148 122,138 Z" fill="#ffffff" opacity="0.4"/>
      <!-- Search Icon (Magnifying Glass) -->
      <g transform="translate(180, 180)" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="-3" cy="-3" r="19" stroke="#ffffff"/>
        <line x1="11" y1="11" x2="25" y2="25" stroke="#ffffff" stroke-width="6"/>
        <!-- Inner lens reflection -->
        <path d="M -15,-6 A 12 12 0 0 1 -6,-15" stroke="#ffffff" stroke-width="2.5" opacity="0.6"/>
      </g>
    </g>

    <!-- ==================== TILE 2: TOP-RIGHT (AI / Intelligence Sparkle) ==================== -->
    <g filter="url(#tileShadow)">
      <rect x="266" y="114" width="132" height="132" rx="34" fill="url(#aiGlassTile)"/>
      <rect x="266" y="114" width="132" height="132" rx="34" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>
      <!-- Top Bevel Glint -->
      <path d="M 274,138 C 274,126 286,120 300,120 L 364,120 C 378,120 390,126 390,138 C 342,148 302,148 274,138 Z" fill="#ffffff" opacity="0.3"/>
      <!-- AI 4-Pointed Sparkle / Neural Intelligence Star -->
      <g transform="translate(332, 180)">
        <!-- Ambient AI Star Glow -->
        <circle cx="0" cy="0" r="16" fill="#818cf8" opacity="0.3" filter="blur(5px)"/>
        <!-- Main AI Sparkle Shape -->
        <path d="M 0,-28 Q 0,0 28,0 Q 0,0 0,28 Q 0,0 -28,0 Q 0,0 0,-28 Z" fill="#ffffff" opacity="0.95"/>
        <!-- Micro Secondary Sparkle -->
        <path d="M 18,-18 Q 18,-10 26,-10 Q 18,-10 18,-2 Q 18,-10 10,-10 Q 18,-10 18,-18 Z" fill="#38bdf8" opacity="0.9"/>
      </g>
    </g>

    <!-- ==================== TILE 3: BOTTOM-LEFT (Crypto / Trading Candlestick & Line Chart) ==================== -->
    <g filter="url(#tileShadow)">
      <rect x="114" y="266" width="132" height="132" rx="34" fill="url(#chartGlassTile)"/>
      <rect x="114" y="266" width="132" height="132" rx="34" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>
      <!-- Top Bevel Glint -->
      <path d="M 122,290 C 122,278 134,272 148,272 L 212,272 C 226,272 238,278 238,290 C 190,300 150,300 122,290 Z" fill="#ffffff" opacity="0.25"/>
      <!-- Trading Candlesticks & Ascending Price Trend -->
      <g transform="translate(180, 332)">
        <!-- Candlestick 1 (Left) -->
        <line x1="-30" y1="2" x2="-30" y2="24" stroke="#34d399" stroke-width="2" opacity="0.6"/>
        <rect x="-35" y="8" width="10" height="12" rx="2" fill="#34d399" opacity="0.8"/>
        <!-- Candlestick 2 (Middle) -->
        <line x1="-10" y1="-12" x2="-10" y2="16" stroke="#34d399" stroke-width="2" opacity="0.7"/>
        <rect x="-15" y="-6" width="10" height="16" rx="2" fill="#34d399" opacity="0.9"/>
        <!-- Candlestick 3 (Right - Bullish Surge) -->
        <line x1="12" y1="-26" x2="12" y2="4" stroke="#10b981" stroke-width="2.5"/>
        <rect x="6" y="-20" width="12" height="20" rx="2.5" fill="#10b981"/>
        <!-- Dynamic Upward Trend Wave Line -->
        <path d="M -38,18 Q -16,8 8,-12 T 32,-20" fill="none" stroke="#6ee7b7" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="32" cy="-20" r="4.5" fill="#ffffff"/>
      </g>
    </g>

    <!-- ==================== TILE 4: BOTTOM-RIGHT (Tasks & Notes Pad) ==================== -->
    <g filter="url(#tileShadow)">
      <rect x="266" y="266" width="132" height="132" rx="34" fill="url(#violetTile)"/>
      <rect x="267" y="267" width="130" height="130" rx="33" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.45"/>
      <!-- Top Bevel Glint -->
      <path d="M 274,290 C 274,278 286,272 300,272 L 364,272 C 378,272 390,278 390,290 C 342,300 302,300 274,290 Z" fill="#ffffff" opacity="0.35"/>
      <!-- Checklist / Notes Pad Glyphs -->
      <g transform="translate(332, 332)">
        <!-- Task 1: Checked item -->
        <circle cx="-24" cy="-16" r="7.5" fill="#ffffff" opacity="0.95"/>
        <path d="M -27,-16 L -25,-14 L -21,-18" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="-10" y="-19" width="38" height="6" rx="3" fill="#ffffff" opacity="0.9"/>
        
        <!-- Task 2: Second item -->
        <circle cx="-24" cy="3" r="7.5" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
        <path d="M -27,3 L -25,5 L -21,1" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="-10" y="0" width="30" height="6" rx="3" fill="#ffffff" opacity="0.7"/>

        <!-- Task 3: Third item -->
        <circle cx="-24" cy="22" r="7.5" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
        <rect x="-10" y="19" width="22" height="6" rx="3" fill="#ffffff" opacity="0.5"/>
      </g>
    </g>

  </g>
</svg>
