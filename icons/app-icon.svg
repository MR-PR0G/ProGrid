<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Deep Obsidian Navy) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161a22"/>
      <stop offset="50%" stop-color="#0e1116"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>

    <!-- Ambient Subtle Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#1d4ed8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Blue Gradient 1: Bright Electric Blue -->
    <linearGradient id="brightBlueTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Blue Gradient 2: Darker Sapphire Blue -->
    <linearGradient id="darkerBlueTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>

    <!-- Gray Gradient 1: Cool Slate Gray -->
    <linearGradient id="slateGrayTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Gray Gradient 2: Deep Charcoal Gray -->
    <linearGradient id="darkGrayTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glass Specular Highlight -->
    <linearGradient id="specularGlint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="tileBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#ambientGlow)"/>
  
  <!-- Outer Specular Ring -->
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- Top Specular Sheen -->
  <path d="M 0,115 Q 0,0 115,0 L 397,0 Q 512,0 512,115 C 400,160 112,160 0,115 Z" fill="url(#specularGlint)" opacity="0.15"/>

  <!-- Criss-Cross Diagonal Grid: Top-Left & Bottom-Right are Blue; Top-Right & Bottom-Left are Gray -->
  <g filter="url(#shadowFilter)">
    
    <!-- ==================== TILE 1: TOP-LEFT (Bright Electric Blue - Search) ==================== -->
    <g filter="url(#tileShadow)">
      <rect x="97" y="97" width="150" height="150" rx="38" fill="url(#brightBlueTile)"/>
      <rect x="98" y="98" width="148" height="148" rx="37" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/>
      <!-- Top Bevel Glint -->
      <path d="M 106,124 C 106,110 120,103 136,103 L 208,103 C 224,103 238,110 238,124 C 190,135 145,135 106,124 Z" fill="#ffffff" opacity="0.4"/>
      <!-- Search Icon (Magnifying Glass) -->
      <g transform="translate(172, 172)" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="-4" cy="-4" r="21" stroke="#ffffff"/>
        <line x1="12" y1="12" x2="28" y2="28" stroke="#ffffff" stroke-width="6.5"/>
        <path d="M -17,-7 A 14 14 0 0 1 -7,-17" stroke="#ffffff" stroke-width="2.8" opacity="0.6"/>
      </g>
    </g>

    <!-- ==================== TILE 2: TOP-RIGHT (Cool Slate Gray - AI Sparkle) [DIAGONAL OPPOSITE TO BLUE] ==================== -->
    <g filter="url(#tileShadow)">
      <rect x="265" y="97" width="150" height="150" rx="38" fill="url(#slateGrayTile)"/>
      <rect x="265" y="97" width="150" height="150" rx="38" fill="none" stroke="url(#tileBorderGrad)" stroke-width="2"/>
      <!-- Top Bevel Glint -->
      <path d="M 274,124 C 274,110 288,103 304,103 L 376,103 C 392,103 406,110 406,124 C 358,135 313,135 274,124 Z" fill="#ffffff" opacity="0.25"/>
      <!-- AI Intelligence Star -->
      <g transform="translate(340, 172)">
        <circle cx="0" cy="0" r="18" fill="#38bdf8" opacity="0.2" filter="blur(6px)"/>
        <path d="M 0,-32 Q 0,0 32,0 Q 0,0 0,32 Q 0,0 -32,0 Q 0,0 0,-32 Z" fill="#ffffff" opacity="0.95"/>
        <path d="M 20,-20 Q 20,-11 29,-11 Q 20,-11 20,-2 Q 20,-11 11,-11 Q 20,-11 20,-20 Z" fill="#38bdf8" opacity="0.95"/>
      </g>
    </g>

    <!-- ==================== TILE 3: BOTTOM-LEFT (Deep Charcoal Gray - Trading Chart) [DIAGONAL MATCH TO SLATE GRAY] ==================== -->
    <g filter="url(#tileShadow)">
      <rect x="97" y="265" width="150" height="150" rx="38" fill="url(#darkGrayTile)"/>
      <rect x="98" y="266" width="148" height="148" rx="37" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25"/>
      <!-- Top Bevel Glint -->
      <path d="M 106,292 C 106,278 120,271 136,271 L 208,271 C 224,271 238,278 238,292 C 190,303 145,303 106,292 Z" fill="#ffffff" opacity="0.25"/>
      <!-- Trading Candlesticks & Surge Wave -->
      <g transform="translate(172, 340)">
        <!-- Candlestick 1 -->
        <line x1="-34" y1="2" x2="-34" y2="26" stroke="#94a3b8" stroke-width="2.2" opacity="0.7"/>
        <rect x="-40" y="8" width="12" height="13" rx="2.5" fill="#cbd5e1" opacity="0.85"/>
        <!-- Candlestick 2 -->
        <line x1="-12" y1="-14" x2="-12" y2="18" stroke="#94a3b8" stroke-width="2.2" opacity="0.75"/>
        <rect x="-18" y="-7" width="12" height="17" rx="2.5" fill="#cbd5e1" opacity="0.95"/>
        <!-- Candlestick 3 (Surge) -->
        <line x1="14" y1="-30" x2="14" y2="6" stroke="#38bdf8" stroke-width="2.8"/>
        <rect x="7" y="-23" width="14" height="22" rx="3" fill="#38bdf8"/>
        <!-- Dynamic Trend Line -->
        <path d="M -44,20 Q -18,10 10,-12 T 38,-22" fill="none" stroke="#ffffff" stroke-width="3.8" stroke-linecap="round"/>
        <circle cx="38" cy="-22" r="5" fill="#ffffff"/>
      </g>
    </g>

    <!-- ==================== TILE 4: BOTTOM-RIGHT (Darker Sapphire Blue - Tasks & Notes) [DIAGONAL MATCH TO ELECTRIC BLUE] ==================== -->
    <g filter="url(#tileShadow)">
      <rect x="265" y="265" width="150" height="150" rx="38" fill="url(#darkerBlueTile)"/>
      <rect x="265" y="265" width="150" height="150" rx="38" fill="none" stroke="url(#tileBorderGrad)" stroke-width="2"/>
      <!-- Top Bevel Glint -->
      <path d="M 274,292 C 274,278 288,271 304,271 L 376,271 C 392,271 406,278 406,292 C 358,303 313,303 274,292 Z" fill="#ffffff" opacity="0.3"/>
      <!-- Tasks & Notes Glyphs -->
      <g transform="translate(340, 340)">
        <!-- Task 1: Checked item -->
        <circle cx="-28" cy="-18" r="8.5" fill="#38bdf8"/>
        <path d="M -31,-18 L -29,-16 L -24,-21" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="-12" y="-21" width="44" height="7" rx="3.5" fill="#ffffff" opacity="0.95"/>
        
        <!-- Task 2: Second item -->
        <circle cx="-28" cy="3" r="8.5" fill="none" stroke="#60a5fa" stroke-width="2.2"/>
        <path d="M -31,3 L -29,5 L -24,0" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="-12" y="0" width="34" height="7" rx="3.5" fill="#ffffff" opacity="0.8"/>

        <!-- Task 3: Third item -->
        <circle cx="-28" cy="24" r="8.5" fill="none" stroke="#3b82f6" stroke-width="2.2" opacity="0.6"/>
        <rect x="-12" y="21" width="26" height="7" rx="3.5" fill="#93c5fd" opacity="0.65"/>
      </g>
    </g>

  </g>
</svg>
