<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <title>ProGrid Workspace</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js?v=0.1.1').then(reg => {
                reg.update();
            });
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    refreshing = true;
                    window.location.reload();
                }
            });
        }
    </script>
</head>
<body>
    <div id="dynamic-bg-layer" class="bg-layer"></div>
    
    <div id="app-container">
        <div id="blur-overlay"></div>
        <div id="grid-scale-wrapper">
            <div id="grid-container">
                <div id="ghost-guide"></div>
            </div>
        </div>
    </div>

    <div id="delete-zone">🗑️</div>
    <button id="done-btn">Done</button>
    <div id="edit-mode-hint" class="edit-hint-pill">
        <span>✨ Drag to organize • Resize from corner • Tap widget for options</span>
    </div>

    <div id="edit-panel">
        <div class="panel-tabs">
            <button class="panel-tab active" data-tab="widgets">Widgets</button>
            <button class="panel-tab" data-tab="appearance">Appearance</button>
        </div>

        <!-- Widgets Drawer Tab -->
        <div class="panel-content active" id="tab-widgets">
            <div class="store-search-bar">
                <div class="store-search-field">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.7; flex-shrink: 0;">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="widget-store-search" placeholder="Search widgets (Clock, Notes, Calc...)" autocomplete="off" spellcheck="false">
                    <button id="widget-store-search-clear" style="display: none;">✕</button>
                </div>
                <div class="store-subnav-pills">
                    <button class="subnav-pill active" id="subtab-installed-btn" data-sub="installed">
                        <span>Installed</span>
                        <span class="subnav-pill-badge" id="installed-count-pill">6</span>
                    </button>
                    <button class="subnav-pill" id="subtab-marketplace-btn" data-sub="marketplace">
                        <span>Online Hub</span>
                        <span class="subnav-pill-badge hub">Online</span>
                    </button>
                </div>
            </div>

            <!-- Installed Widgets Scroll List -->
            <div class="store-list-container" id="store-installed-list"></div>

            <!-- Online Hub Marketplace List -->
            <div class="store-list-container" id="store-marketplace-list" style="display: none;"></div>
        </div>

        <!-- Appearance & Wallpaper Gallery Tab -->
        <div class="panel-content" id="tab-appearance" style="flex-direction: column; gap: 14px;">
            <!-- Wallpaper Gallery Header -->
            <div class="appearance-section-title">
                <span style="font-size: 13px; font-weight: 700;">Curated HD Wallpapers</span>
                <span style="font-size: 11px; color: var(--text-secondary);">1-Click Apply</span>
            </div>
            
            <div class="wallpaper-gallery-scroll" id="wallpaper-gallery-container">
                <!-- Dynamically populated from WALLPAPER_COLLECTION -->
            </div>

            <div style="display: flex; gap: 12px; align-items: center; width: 100%; border-top: 1px solid var(--panel-border); padding-top: 10px;">
                <div style="display: flex; gap: 8px; align-items: center;" id="bg-presets-list">
                    <div class="bg-thumb" data-preset="1" title="Gradient 1" style="width: 30px; height: 30px; border-radius: 50%; background: var(--bg-preset-1); border: 2px solid white; cursor: pointer;"></div>
                    <div class="bg-thumb bg-dynamic" data-preset="2" title="Gradient 2" style="width: 30px; height: 30px; border-radius: 50%; background: var(--bg-preset-2); border: 2px solid transparent; cursor: pointer;"></div>
                    <div class="bg-thumb bg-dynamic" data-preset="3" title="Gradient 3" style="width: 30px; height: 30px; border-radius: 50%; background: var(--bg-preset-3); border: 2px solid transparent; cursor: pointer;"></div>
                    
                    <button id="custom-bg-btn" title="Upload custom wallpaper" style="width: 30px; height: 30px; border-radius: 50%; background: rgba(128,128,128,0.2); border: 1px dashed var(--text-secondary); cursor: pointer; color: var(--text-primary); font-size: 14px; display: flex; align-items: center; justify-content: center;">+</button>
                    <input type="file" id="custom-bg-input" accept="image/*" style="display: none;">
                </div>
                <button id="reset-bg-btn" style="padding: 5px 10px; background: rgba(255,255,255,0.06); border: 1px solid var(--panel-border); border-radius: 8px; color: var(--text-secondary); font-size: 11px; cursor: pointer; margin-left: auto;">Reset Default</button>
            </div>
            
            <div style="display: flex; gap: 16px; align-items: center; width: 100%; justify-content: space-between;">
                <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
                    <label style="font-size: 11px; color: var(--text-secondary);">Blur Overlay</label>
                    <input type="range" id="blur-slider" min="0" max="40" value="16" style="width: 100%;">
                </div>
                <div style="display: flex; flex-direction: column; gap: 4px; align-items: flex-end;">
                    <label style="font-size: 11px; color: var(--text-secondary);">Light Mode</label>
                    <label class="glass-toggle-switch">
                        <input type="checkbox" id="theme-toggle">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>

            <div style="display: flex; gap: 8px; width: 100%; border-top: 1px solid var(--panel-border); padding-top: 10px;">
                <button id="pwa-install-btn" style="display: none; flex: 1; padding: 8px; background: #3b82f6; border: none; border-radius: 8px; color: white; font-size: 11px; font-weight: 600; cursor: pointer; align-items: center; justify-content: center; gap: 4px;">📲 Install App</button>
                <button id="export-cfg-btn" style="flex: 1; padding: 8px; background: rgba(255,255,255,0.08); border: 1px solid var(--panel-border); border-radius: 8px; color: var(--text-primary); font-size: 11px; font-weight: 500; cursor: pointer;">📥 Backup</button>
                <button id="import-cfg-btn" style="flex: 1; padding: 8px; background: rgba(255,255,255,0.08); border: 1px solid var(--panel-border); border-radius: 8px; color: var(--text-primary); font-size: 11px; font-weight: 500; cursor: pointer;">📤 Restore</button>
                <input type="file" id="import-cfg-input" accept=".json" style="display: none;">
            </div>
        </div>
    </div>

    <div id="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 10000; align-items: center; justify-content: center;">
        <div id="edit-modal" style="background: var(--modal-bg); padding: 24px; border-radius: 16px; width: 340px; border: 1px solid var(--panel-border); display: flex; flex-direction: column; gap: 16px; color: var(--text-primary);">
            <input type="hidden" id="edit-w-id">
            
            <div class="modal-field id-shortcut-only" style="display: flex; flex-direction: column; gap: 6px;">
                <label style="color: var(--text-secondary); font-size: 12px;">Title</label>
                <input type="text" class="modal-input" id="edit-w-title">
            </div>
            
            <div class="modal-field id-shortcut-only" style="display: flex; flex-direction: column; gap: 6px;">
                <label style="color: var(--text-secondary); font-size: 12px;">URL</label>
                <input type="text" class="modal-input" id="edit-w-url">
            </div>
            
            <div class="modal-field id-shortcut-only" style="display: flex; flex-direction: column; gap: 6px;">
                <label style="color: var(--text-secondary); font-size: 12px;">Icon</label>
                <input type="text" class="modal-input" id="edit-w-icon" placeholder="Emoji/Text or empty">
            </div>

            <div class="modal-field id-shortcut-only" style="display: flex; flex-direction: column; gap: 6px;">
                <label style="color: var(--text-secondary); font-size: 12px;">Icon Shape</label>
                <div class="shape-options" style="display: flex; gap: 8px;">
                    <button class="shape-btn" data-shape="4px" style="flex:1; padding:8px 0; background:var(--panel-border); border:2px solid transparent; border-radius:8px; cursor:pointer;"><div style="width:20px;height:20px;border:2px solid var(--text-primary);border-radius:2px;margin:auto;"></div></button>
                    <button class="shape-btn" data-shape="20px" style="flex:1; padding:8px 0; background:var(--panel-border); border:2px solid transparent; border-radius:8px; cursor:pointer;"><div style="width:20px;height:20px;border:2px solid var(--text-primary);border-radius:8px;margin:auto;"></div></button>
                    <button class="shape-btn" data-shape="50%" style="flex:1; padding:8px 0; background:var(--panel-border); border:2px solid transparent; border-radius:8px; cursor:pointer;"><div style="width:20px;height:20px;border:2px solid var(--text-primary);border-radius:50%;margin:auto;"></div></button>
                </div>
            </div>

            <div class="modal-field id-shortcut-only" style="display: flex; flex-direction: column; gap: 6px;">
                <label style="color: var(--text-secondary); font-size: 12px;">Icon Background Color</label>
                <div class="color-swatch-container">
                    <div class="color-swatch-btn" data-target="iconBg" data-color="transparent" style="background:#333; font-size:10px; color:white;" title="Transparent">🚫</div>
                    <div class="color-swatch-btn" data-target="iconBg" data-color="#ffffff" style="background:#ffffff;"></div>
                    <div class="color-swatch-btn" data-target="iconBg" data-color="#1e1e2e" style="background:#1e1e2e;"></div>
                    <div class="color-swatch-btn" data-target="iconBg" data-color="#3b82f6" style="background:#3b82f6;"></div>
                    <div class="color-swatch-btn" data-target="iconBg" data-color="#10b981" style="background:#10b981;"></div>
                    <div class="color-picker-wrapper" data-target="iconBg" title="Custom Color"><input type="color"></div>
                </div>
            </div>

            <div class="modal-field id-folder-only" style="display: flex; flex-direction: column; gap: 6px;">
                <label style="color: var(--text-secondary); font-size: 12px;">Folder Name</label>
                <input type="text" class="modal-input" id="edit-folder-title">
            </div>

            <div class="modal-field id-search-only" style="display: flex; flex-direction: column; gap: 6px;">
                <label style="color: var(--text-secondary); font-size: 12px;">Search Engine</label>
                <select class="modal-input" id="edit-search-engine">
                    <option value="google">Google</option>
                    <option value="bing">Bing</option>
                    <option value="duckduckgo">DuckDuckGo</option>
                </select>
            </div>
            <div class="modal-field id-search-only" style="display: flex; flex-direction: column; gap: 6px;">
                <label style="color: var(--text-secondary); font-size: 12px;">Placeholder</label>
                <input type="text" class="modal-input" id="edit-search-placeholder">
            </div>

            <div style="width: 100%; height: 1px; background: var(--panel-border); margin: 4px 0;"></div>

            <div style="display: flex; flex-direction: column; gap: 6px;">
                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <label style="color: var(--text-secondary); font-size: 12px;">Widget Body Color</label>
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <span style="color: var(--text-secondary); font-size: 11px;">Frosted Glass</span>
                        <label class="glass-toggle-switch">
                            <input type="checkbox" id="edit-w-glass-toggle">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>
                <div class="color-swatch-container">
                    <div class="color-swatch-btn" data-target="widgetBg" data-color="transparent" style="background:#333; font-size:10px; color:white;" title="Transparent">🚫</div>
                    <div class="color-swatch-btn" data-target="widgetBg" data-color="#ffffff" style="background:#ffffff;"></div>
                    <div class="color-swatch-btn" data-target="widgetBg" data-color="#1e1e2e" style="background:#1e1e2e;"></div>
                    <div class="color-swatch-btn" data-target="widgetBg" data-color="#3b82f6" style="background:#3b82f6;"></div>
                    <div class="color-swatch-btn" data-target="widgetBg" data-color="#10b981" style="background:#10b981;"></div>
                    <div class="color-picker-wrapper" data-target="widgetBg" title="Custom Color"><input type="color"></div>
                </div>
            </div>

            <div class="modal-actions" style="display: flex; gap: 8px; margin-top: 8px;">
                <button class="modal-btn" id="modal-save-btn" style="flex:1; padding: 10px; background: #3b82f6; border: none; color: white; border-radius: 8px; cursor: pointer;">Save</button>
                <button class="modal-btn" id="modal-cancel-btn" style="flex:1; padding: 10px; background: var(--panel-border); border: none; color: var(--text-primary); border-radius: 8px; cursor: pointer;">Cancel</button>
                <button class="modal-btn" id="modal-delete-btn" style="padding: 10px; background: #ef4444; border: none; color: white; border-radius: 8px; cursor: pointer;">Delete</button>
            </div>
        </div>
    </div>

    <!-- Folder Overlay View -->
    <div id="folder-overlay-view">
        <div id="folder-popup-card">
            <h3 id="folder-popup-title">Folder</h3>
            <div id="folder-popup-grid"></div>
        </div>
    </div>

    <!-- Floating Quick Actions Menu on Long-Press -->
    <div id="widget-quick-menu">
        <button class="quick-menu-item" id="qm-edit-btn">
            <span class="quick-menu-icon">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
            </span>
            <span>Edit Widget</span>
        </button>
        <button class="quick-menu-item" id="qm-info-btn">
            <span class="quick-menu-icon">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
            </span>
            <span>Widget Info</span>
        </button>
        <button class="quick-menu-item" id="qm-layout-btn">
            <span class="quick-menu-icon">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
            </span>
            <span>Move & Resize</span>
        </button>
        <div style="height: 1px; background: var(--panel-border); margin: 3px 0;"></div>
        <button class="quick-menu-item danger" id="qm-delete-btn">
            <span class="quick-menu-icon">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </span>
            <span>Delete</span>
        </button>
    </div>

    <!-- Widget Information Modal -->
    <div id="widget-info-modal">
        <div class="info-modal-card">
            <div class="info-header">
                <div id="info-w-icon">📦</div>
                <div>
                    <h3 id="info-w-label">Widget Name</h3>
                    <span id="info-w-type">type</span>
                </div>
            </div>
            <div id="info-w-desc" class="info-desc">Widget details and description.</div>
            <div class="info-rows">
                <div class="info-row"><span class="info-label">Author:</span><span class="info-val">MR Prog</span></div>
                <div class="info-row"><span class="info-label">Version:</span><span class="info-val">0.0.9</span></div>
                <div class="info-row"><span class="info-label">Dimensions:</span><span id="info-w-size" class="info-val">2 × 1</span></div>
                <div class="info-row"><span class="info-label">Engine:</span><span class="info-val">ProGrid Fluid Grid</span></div>
            </div>
            <button id="info-close-btn" class="info-btn">Got it</button>
        </div>
    </div>

    <script type="text/javascript">
        window.WidgetGlobals = {
            _registry: new Map(),
            register(cls) {
                if (!cls || !cls.getMetadata) return;
                const meta = cls.getMetadata();
                this._registry.set(meta.type, { cls, meta });
            },
            get(type) {
                const item = this._registry.get(type);
                return item ? item.cls : null;
            },
            getMetadata(type) {
                const item = this._registry.get(type);
                return item ? item.meta : null;
            },
            getAllMetadata() {
                return Array.from(this._registry.values()).map(x => x.meta);
            }
        };
    </script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
